name = "akhmad-academy-crm"
main = "dist/server/index.mjs"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Public backend coordinates are safe to expose and must be available to both
# SSR and browser builds. Privileged credentials remain Cloudflare secrets.
[vars]
SUPABASE_URL = "https://bsuvywszdkqaetbyrfqk.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdXZ5d3N6ZGtxYWV0YnlyZnFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0MzcxNzgsImV4cCI6MjEwMDAxMzE3OH0.Bo-aXzNniUAdh24ProFFcpXxlrik-7Od0Q0tW23TTC0"

[assets]
directory = "dist/client"
binding = "ASSETS"

# Build: bun run build:cloudflare
# Deploy: bunx wrangler deploy
#   (build generates .wrangler/deploy/config.json, so wrangler picks up
#    dist/server/wrangler.json automatically — main/assets above are a fallback)
# Secrets (bunx wrangler secret put NAME):
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, SUPABASE_SERVICE_ROLE_KEY,
#   APP_BASE_URL, CRON_SECRET, TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET
# VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY must be present at BUILD time.

# Cloudflare Workers Builds (GitHub'dan avtomatik deploy) uchun build buyrug'i.
# Bu bo'lmasa CF default `npm run build` (Vercel preseti) ni ishlatib xato beradi.
[build]
command = "bun install --frozen-lockfile && bun run build:cloudflare"
